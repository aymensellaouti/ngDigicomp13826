<!-- A partir d'angular 19 on passe à Style -->
<div
  [ngStyle]="{
    backgroundColor: color,
    color: bgc,
    fontFamily: font,
    fontSize: size + 'px'
  }"
  >
Exo color</div>
<input appRainbow (change)="changeColor(inputColor)" #inputColor type="text" class="form-control">


<!-- Quand le user clique sur le boutton appelle reset -->
<button appRainbow (click)="reset()" class="btn btn-danger">
  reset
</button>

<p appRainbow appHighlight>cc</p>
