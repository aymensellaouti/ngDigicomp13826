<!-- D'orénavant hidden doit dépendre de isHidden -->
<p [style.color]="color" [hidden]="isHidden">Cc {{ name }}</p>

<input
  #myInput
  (change)="changeMessage(myInput.value)"
  type="text" class="form-control">
<p>Le contenu de l'input est : {{ message }}</p>
<div style="color: blue;" (click)="showHide()" class="alert alert-success">
  <app-second/>
</div>
