<!-- Todo 2 : Avec ngStyle associé les styles qu'on veut gérer -->
<p
  [ngStyle]="{
    color: color(),
    fontFamily: fontFamily(),
    fontSize: size() + 'px'
  }"
>mini-word works!</p>

<div class="row">
  <!-- Todo 3 : Associer les inputs aux attributs d'état du TS avec ngModel -->
  <div class="col"><input [(ngModel)]="color" type="color" class="form-control" /></div>
  <div class="col"><input [(ngModel)]="size" type="number" class="form-control" /></div>
  <div class="col">
    <select [(ngModel)]="fontFamily" class="form-control">
      <option value="garamond">garamond</option>
      <option value="latin">latin</option>
      <option value="verdana">verdana</option>
    </select>
  </div>
</div>
